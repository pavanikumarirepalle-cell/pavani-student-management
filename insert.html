
<!DOCTYPE html>
<html>
<head>
    <title>Insert Student</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .insert-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 35px;
            max-width: 1250px;
            margin: 25px auto;
            padding: 15px;
        }

        .insert-form {
            width: 400px;
            max-width: 100%;
            flex-shrink: 0;
        }

        .insert-form h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .insert-form label {
            display: block;
            margin-top: 12px;
        }

        .insert-form input {
            width: 100%;
            padding: 9px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .insert-image {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-width: 0;
        }

        .insert-image img {
            display: block;
            width: 100%;
            max-width: 750px;
            height: 550px;
            object-fit: contain;
            object-position: center;
            border-radius: 10px;
        }

        @media (max-width: 700px) {
            .insert-container {
                flex-direction: column;
                gap: 15px;
            }

            .insert-form {
                width: 100%;
            }

            .insert-image {
                width: 100%;
            }

            .insert-image img {
                width: 100%;
                max-width: 600px;
                height: 400px;
                object-fit: contain;
            }
        }
    </style>
</head>

<body>

<nav>
    <a href="index.html">Home</a>
    <a href="list.html">List Students</a>
    <a href="listOne.html">List Required Student</a>
    <a href="insert.html">Insert Student</a>
    <a href="update.html">Update Student</a>
    <a href="delete.html">Delete Student</a>
</nav>

<div class="insert-container">

    <div class="insert-form">
        <h1>INSERT STUDENT</h1>

        <form id="insertForm">

            <label for="sno">Student Number</label>
            <input type="number" id="sno"
                   placeholder="Enter student number"
                   min="1" required>

            <label for="name">Student Name</label>
            <input type="text" id="name"
                   placeholder="Enter student name"
                   required>

            <label for="total">Total Marks</label>
            <input type="number" id="total"
                   placeholder="Enter total marks"
                   min="0" required>

            <label for="age">Age</label>
            <input type="number" id="age"
                   placeholder="Enter age"
                   min="1" required>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone"
                   placeholder="Enter phone number"
                   pattern="[0-9]{10}"
                   maxlength="10" required>

            <div class="buttons">
                <button type="submit">Save</button>

                <button type="button"
                        onclick="location.href='index.html'">
                    Home Page
                </button>
            </div>

        </form>
    </div>

    <div class="insert-image">
        <img src="images/insert.png" alt="Student">
    </div>

</div>

<script>
document.getElementById("insertForm")
.addEventListener("submit", async function(event) {
    event.preventDefault();

    const student = {
        sno: Number(document.getElementById("sno").value),
        name: document.getElementById("name").value.trim(),
        total: Number(document.getElementById("total").value),
        age: Number(document.getElementById("age").value),
        phone: document.getElementById("phone").value.trim()
    };

    if (
        student.sno <= 0 ||
        student.name === "" ||
        student.total < 0 ||
        student.age <= 0
    ) {
        alert("Please enter valid student details.");
        return;
    }

    try {
        const response = await fetch("/students", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(student)
        });

        const message = await response.text();

        if (response.ok) {
            alert(message || "Student saved successfully!");
            this.reset();
        } else {
            alert("Save failed: " + message);
        }

    } catch (error) {
        alert("Server connection problem!");
        console.error(error);
    }
});
</script>

</body>
</html>
